<script>
  (function (d) {
    d.classList.add('js');
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Arriving from an in-site link: start covered by the transition curtain (see main.js)
    try {
      if (sessionStorage.getItem('edge-transition')) {
        sessionStorage.removeItem('edge-transition');
        if (!reduce) d.classList.add('is-arriving');
      }
    } catch (e) {}
    // Failsafe: if the site script fails to run, show everything anyway
    setTimeout(function () {
      if (!d.classList.contains('is-ready')) d.classList.add('is-ready', 'intro-failsafe');
    }, 6000);
  })(document.documentElement);
</script>
